<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .clip { position: absolute; left: 50%; transform: translateX(-50%); }
      #title {
        color: #ffffff;
        font-size: 96px;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-align: center;
        line-height: 1.1;
        mix-blend-mode: screen;
        top: 40%;
      }
      #subtitle {
        color: #94a3b8;
        font-size: 32px;
        font-weight: 400;
        letter-spacing: 0.05em;
        text-align: center;
        text-transform: uppercase;
        opacity: 0;
        top: 56%;
      }
      #accent {
        width: 120px;
        height: 4px;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        border-radius: 2px;
        opacity: 0;
        top: 64%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <h1 id="title" class="clip" data-start="0" data-duration="10" data-track-index="0">الذكاء الاصطناعي</h1>
      <h2 id="subtitle" class="clip" data-start="2" data-duration="7" data-track-index="1">مستقبل الإبداع بدأ الآن</h2>
      <div id="accent" class="clip" data-start="4" data-duration="5" data-track-index="2"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#title", { y: 0, opacity: 1, duration: 0 }, 0);
      tl.to("#subtitle", { opacity: 1, y: -10, duration: 1, ease: "power2.out" }, 1);
      tl.to("#accent", { opacity: 1, scaleX: 1.4, duration: 0.8, ease: "back.out(1.7)" }, 2.5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
